<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07111f" />
  <title>Flutter Knowledge Orbit</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --bg-deep: #030811;
      --panel: rgba(9, 21, 38, 0.82);
      --panel-solid: #0a1729;
      --panel-soft: rgba(17, 35, 58, 0.68);
      --line: rgba(145, 180, 222, 0.16);
      --line-strong: rgba(145, 210, 255, 0.3);
      --text: #f4f8ff;
      --muted: #91a7c2;
      --cyan: #62e6ff;
      --green: #8bf5bb;
      --amber: #ffc978;
      --pink: #ff91ca;
      --purple: #b09cff;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

    .app-shell {
      position: relative;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 360px;
      grid-template-rows: 78px minmax(0, 1fr);
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 45%, rgba(25, 83, 118, 0.22), transparent 34%),
        radial-gradient(circle at 82% 12%, rgba(132, 92, 203, 0.13), transparent 26%),
        linear-gradient(135deg, #06101d 0%, #071525 52%, #050b15 100%);
    }

    .app-shell::before {
      position: absolute;
      inset: 0;
      pointer-events: none;
      content: "";
      opacity: 0.18;
      background-image: linear-gradient(rgba(133, 178, 214, 0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(133, 178, 214, 0.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 88%);
    }

    .topbar {
      z-index: 5;
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 0 26px;
      border-bottom: 1px solid var(--line);
      background: rgba(4, 12, 24, 0.72);
      backdrop-filter: blur(18px);
    }

    .brand { display: flex; align-items: center; gap: 13px; min-width: 240px; }
    .brand-mark {
      position: relative;
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      overflow: hidden;
      border: 1px solid rgba(98, 230, 255, 0.5);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #a8f8ff, #2d8db4 34%, #263267 70%, #11172d);
      box-shadow: 0 0 22px rgba(98, 230, 255, 0.32);
    }
    .brand-mark::after { content: ""; width: 25px; height: 8px; border: 1px solid rgba(255,255,255,.7); border-radius: 50%; transform: rotate(-25deg); }
    .brand h1 { margin: 0; font-size: 15px; letter-spacing: .12em; font-weight: 750; }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }

    .top-actions { display: flex; align-items: center; gap: 10px; }
    .search {
      display: flex;
      align-items: center;
      gap: 8px;
      width: min(280px, 30vw);
      height: 38px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: rgba(11, 27, 46, 0.76);
    }
    .search span { color: var(--muted); font-size: 15px; }
    .search input { width: 100%; border: 0; outline: 0; color: var(--text); background: transparent; font-size: 12px; }
    .search input::placeholder { color: #7087a4; }
    .icon-btn, .ghost-btn, .primary-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: var(--text);
      background: rgba(11, 27, 46, 0.7);
      transition: .2s ease;
    }
    .icon-btn { width: 38px; padding: 0; font-size: 16px; }
    .ghost-btn:hover, .icon-btn:hover { border-color: var(--line-strong); background: rgba(26, 54, 82, .82); }
    .primary-btn { border-color: rgba(98, 230, 255, .52); background: linear-gradient(135deg, rgba(44, 145, 173, .65), rgba(90, 75, 174, .55)); }
    .primary-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(52, 186, 218, .2); }

    .sidebar, .inspector {
      z-index: 3;
      min-height: 0;
      background: rgba(5, 15, 29, .66);
      backdrop-filter: blur(16px);
    }
    .sidebar { padding: 24px 16px 18px; border-right: 1px solid var(--line); overflow: auto; }
    .inspector { padding: 22px 18px; border-left: 1px solid var(--line); overflow: auto; }
    .eyebrow { margin: 0 0 9px; color: var(--cyan); font-size: 10px; font-weight: 750; letter-spacing: .18em; text-transform: uppercase; }
    .side-heading { display: flex; align-items: end; justify-content: space-between; gap: 10px; margin: 0 0 16px; }
    .side-heading h2 { margin: 0; font-size: 16px; }
    .side-heading span { color: var(--muted); font-size: 11px; }
    .progress-bar { height: 5px; overflow: hidden; border-radius: 99px; background: rgba(143, 176, 211, .12); }
    .progress-bar i { display: block; width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--cyan), var(--green)); transition: width .35s ease; }
    .progress-copy { display: flex; justify-content: space-between; margin: 8px 0 20px; color: var(--muted); font-size: 11px; }
    .route-list { display: grid; gap: 5px; }
    .route-item {
      display: grid;
      grid-template-columns: 8px minmax(0, 1fr) auto;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 10px 9px;
      border: 1px solid transparent;
      border-radius: 11px;
      color: #b9c9dc;
      text-align: left;
      background: transparent;
      transition: .2s ease;
    }
    .route-item:hover, .route-item.active { border-color: var(--line); color: var(--text); background: rgba(25, 53, 81, .6); }
    .route-item.active { box-shadow: inset 3px 0 0 var(--cyan); }
    .route-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--item-color, var(--cyan)); box-shadow: 0 0 12px var(--item-color, var(--cyan)); }
    .route-item strong { overflow: hidden; font-size: 12px; font-weight: 620; text-overflow: ellipsis; white-space: nowrap; }
    .route-item small { color: var(--muted); font-size: 10px; }
    .side-note { margin-top: 24px; padding: 13px; border: 1px solid var(--line); border-radius: 13px; color: var(--muted); font-size: 11px; line-height: 1.6; background: rgba(14, 31, 51, .52); }
    .side-note b { color: var(--text); }

    .stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
    #scene { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
    #scene:active { cursor: grabbing; }
    .stage-copy { position: absolute; top: 27px; left: 34px; z-index: 2; pointer-events: none; }
    .stage-copy h2 { max-width: 470px; margin: 0; font-size: clamp(24px, 3vw, 40px); line-height: 1.08; letter-spacing: -.04em; }
    .stage-copy p { max-width: 440px; margin: 12px 0 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .scene-hint { position: absolute; left: 50%; bottom: 22px; z-index: 2; transform: translateX(-50%); color: rgba(197, 221, 241, .55); font-size: 11px; pointer-events: none; }
    .scene-status { position: absolute; right: 24px; bottom: 22px; z-index: 2; display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; }
    .scene-status i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); }
    .legend { position: absolute; left: 34px; bottom: 22px; z-index: 2; display: flex; gap: 14px; color: var(--muted); font-size: 10px; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend i { width: 7px; height: 7px; border-radius: 50%; }

    .panel-title { display: flex; align-items: start; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .panel-title h2 { margin: 0; font-size: 18px; line-height: 1.2; }
    .panel-title p { margin: 6px 0 0; color: var(--muted); font-size: 11px; }
    .close-panel { display: none; }
    .module-chip { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 12px; color: var(--cyan); font-size: 10px; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; }
    .module-chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--module-color, var(--cyan)); box-shadow: 0 0 11px var(--module-color, var(--cyan)); }
    .detail-section { margin-top: 20px; }
    .detail-section h3 { margin: 0 0 8px; color: #d9e8f8; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .detail-section p { margin: 0; color: #a7b9cf; font-size: 12px; line-height: 1.7; }
    .code-box { position: relative; overflow: auto; padding: 13px 12px; border: 1px solid var(--line); border-radius: 12px; background: #050d18; }
    .code-box pre { margin: 0; color: #d3efff; font: 11px/1.65 "SFMono-Regular", Consolas, monospace; white-space: pre-wrap; }
    .copy-btn { position: absolute; top: 7px; right: 7px; padding: 5px 7px; border: 1px solid var(--line); border-radius: 7px; color: var(--muted); font-size: 10px; background: rgba(21, 43, 68, .8); }
    .copy-btn:hover { color: var(--text); }
    .compare-grid { display: grid; gap: 7px; }
    .compare-row { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 8px; padding: 8px 0; border-bottom: 1px solid rgba(145, 180, 222, .1); }
    .compare-row b { color: var(--muted); font-size: 10px; font-weight: 650; }
    .compare-row span { color: #c5d5e6; font-size: 11px; line-height: 1.5; }
    .pitfalls { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
    .pitfalls li { position: relative; padding-left: 14px; color: #b7c7d9; font-size: 11px; line-height: 1.5; }
    .pitfalls li::before { position: absolute; top: .5em; left: 0; width: 5px; height: 5px; border-radius: 50%; background: var(--amber); content: ""; }
    .question { padding: 13px; border: 1px solid rgba(176, 156, 255, .23); border-radius: 13px; background: rgba(67, 52, 111, .18); }
    .question strong { display: block; margin-bottom: 7px; color: #e5dbff; font-size: 12px; line-height: 1.5; }
    .answer { display: none; color: #c3b9e7; font-size: 11px; line-height: 1.6; }
    .answer.visible { display: block; }
    .task-row { display: flex; align-items: center; gap: 9px; color: #c2d2e2; font-size: 11px; line-height: 1.5; }
    .task-row input { width: 15px; height: 15px; accent-color: var(--green); }
    .panel-actions { display: flex; gap: 8px; margin: 22px 0 6px; }
    .panel-actions button { flex: 1; }
    .empty-state { display: grid; place-items: center; min-height: 70vh; padding: 30px; color: var(--muted); text-align: center; }
    .empty-state strong { display: block; margin-bottom: 7px; color: var(--text); font-size: 16px; }

    .toast { position: fixed; right: 24px; bottom: 24px; z-index: 20; max-width: 280px; padding: 11px 14px; border: 1px solid var(--line-strong); border-radius: 10px; color: var(--text); font-size: 12px; background: #0d2238; box-shadow: var(--shadow); opacity: 0; transform: translateY(10px); pointer-events: none; transition: .25s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .mobile-only { display: none; }

    @media (max-width: 1120px) {
      .app-shell { grid-template-columns: 230px minmax(0, 1fr) 320px; }
      .brand { min-width: 205px; }
      .stage-copy p { max-width: 330px; }
    }

    @media (max-width: 860px) {
      body { overflow: auto; }
      .app-shell { display: block; min-height: 100vh; height: auto; overflow: visible; }
      .topbar { position: sticky; top: 0; height: 68px; padding: 0 15px; }
      .brand { min-width: 0; }
      .brand p, .search { display: none; }
      .top-actions { gap: 6px; }
      .sidebar { position: fixed; top: 68px; bottom: 0; left: 0; z-index: 10; width: min(310px, 86vw); transform: translateX(-102%); transition: transform .25s ease; }
      .sidebar.open { transform: translateX(0); }
      .mobile-only { display: inline-flex; }
      .stage { height: 70vh; min-height: 520px; }
      .stage-copy { top: 20px; left: 18px; right: 18px; }
      .stage-copy h2 { max-width: 340px; font-size: 28px; }
      .stage-copy p { max-width: 320px; font-size: 12px; }
      .legend { left: 18px; bottom: 18px; }
      .scene-status { right: 18px; bottom: 18px; }
      .inspector { min-height: 0; border-top: 1px solid var(--line); border-left: 0; padding: 22px 16px 36px; }
      .close-panel { display: inline-flex; width: 31px; min-height: 31px; padding: 0; }
    }

    @media (max-width: 520px) {
      .stage { height: 68vh; min-height: 500px; }
      .scene-hint { bottom: 48px; white-space: nowrap; }
      .legend { display: none; }
      .scene-status { bottom: 18px; }
      .panel-actions { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <button class="icon-btn mobile-only" id="menuButton" aria-label="打开学习路线">☰</button>
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <h1>FLUTTER KNOWLEDGE ORBIT</h1>
          <p>面向 JavaScript 开发者的交互式学习星球</p>
        </div>
      </div>
      <div class="top-actions">
        <label class="search" aria-label="搜索知识点">
          <span>⌕</span>
          <input id="searchInput" type="search" placeholder="搜索 Dart、布局、面试题..." />
        </label>
        <button class="ghost-btn" id="randomButton">随机面试题</button>
        <button class="icon-btn" id="resetButton" title="重置本地进度" aria-label="重置本地进度">↺</button>
      </div>
    </header>

    <aside class="sidebar" id="sidebar">
      <p class="eyebrow">Learning route</p>
      <div class="side-heading">
        <h2>学习路线</h2>
        <span id="routeCount">0 / 0</span>
      </div>
      <div class="progress-bar"><i id="progressBar"></i></div>
      <div class="progress-copy"><span>总体进度</span><strong id="progressText">0%</strong></div>
      <nav class="route-list" id="routeList" aria-label="Flutter 学习路线"></nav>
      <div class="side-note" id="dailyTaskCard"></div>
      <div class="side-note">
        <b>学习方法</b><br />
        先理解“为什么”，再手写最小示例，最后用 Inspector 排错并回答对应面试题。点击星球节点开始一个模块。
      </div>
    </aside>

    <main class="stage">
      <canvas id="scene" aria-label="可交互的 Flutter 3D 知识星球"></canvas>
      <div class="stage-copy">
        <p class="eyebrow">Interactive curriculum</p>
        <h2>把 Flutter 知识，<br />放进一颗可以探索的星球。</h2>
        <p>拖拽旋转星球，点击节点查看概念、代码、实际坑点和面试题。每一次完成都会改变你的学习轨道。</p>
      </div>
      <div class="legend" aria-label="节点状态图例">
        <span><i style="background: var(--cyan)"></i>未开始</span>
        <span><i style="background: var(--green)"></i>已完成</span>
        <span><i style="background: var(--amber)"></i>当前节点</span>
      </div>
      <div class="scene-hint">拖拽旋转 · 滚轮缩放 · 点击节点</div>
      <div class="scene-status"><i></i><span id="sceneStatus">星球同步中</span></div>
    </main>

    <aside class="inspector" id="inspector" aria-live="polite"></aside>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="flutter-knowledge-modules.js"></script>
  <script src="flutter-handbook-data.js"></script>
  <script>
    const modules = window.FLUTTER_MODULES;
    const handbookData = window.FLUTTER_HANDBOOK_DATA;
    if (!Array.isArray(modules) || !handbookData) {
      document.body.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#07111f;color:#f4f8ff;font:16px system-ui;text-align:center"><div><h1>学习星球暂时无法加载</h1><p>共享模块或手册数据文件缺失，请确认 flutter-knowledge-modules.js 和 flutter-handbook-data.js 与首页在同一目录。</p></div></main>';
      throw new Error('Flutter knowledge data failed to load');
    }

    const storageKey = 'flutter-knowledge-orbit-v1';
    const state = loadState();
    const sceneCanvas = document.getElementById('scene');
    const routeList = document.getElementById('routeList');
    const inspector = document.getElementById('inspector');
    const searchInput = document.getElementById('searchInput');
    const toast = document.getElementById('toast');
    const sidebar = document.getElementById('sidebar');
    function chapterFor(item) { return handbookData.chapters.find((chapter) => chapter.id === item.chapter); }
    function searchText(item) {
      const chapter = chapterFor(item);
      const sections = item.sections.length ? item.sections : (chapter ? chapter.sections.map((section) => section.title) : []);
      return [item.title, item.short, item.desc, item.task, item.question, chapter ? chapter.title : '', ...sections].join(' ').toLowerCase();
    }
    let filteredModules = modules.slice();
    let selectedId = state.selected || state.currentModule || modules[0].id;
    let toastTimer;

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || '{}');
        return { completed: {}, notes: {}, tasks: {}, selected: null, currentModule: null, read: {}, results: {}, wrong: [], xp: 0, badges: {}, streak: { count: 0, lastDate: null }, ...saved };
      } catch (error) {
        return { completed: {}, notes: {}, tasks: {}, selected: null, currentModule: null, read: {}, results: {}, wrong: [], xp: 0, badges: {}, streak: { count: 0, lastDate: null } };
      }
    }

    function saveState() {
      localStorage.setItem(storageKey, JSON.stringify(state));
      updateProgress();
    }

    function selectedModule() { return modules.find((item) => item.id === selectedId) || modules[0]; }
    function completedCount() { return modules.filter((item) => state.completed[item.id]).length; }
    function updateProgress() {
      const percent = Math.round((completedCount() / modules.length) * 100);
      document.getElementById('progressBar').style.width = percent + '%';
      document.getElementById('progressText').textContent = percent + '%';
      document.getElementById('routeCount').textContent = completedCount() + ' / ' + modules.length;
      document.getElementById('sceneStatus').textContent = percent === 100 ? '轨道已完成' : '星球同步中';
      renderRoute();
      renderDailyTask();
      updateNodeMaterials();
    }

    function renderRoute() {
      const items = filteredModules;
      routeList.innerHTML = items.length ? items.map((item) => `
        <button class="route-item ${item.id === selectedId ? 'active' : ''}" data-id="${item.id}" style="--item-color:${item.color}">
          <i class="route-dot"></i>
          <strong>${item.title}</strong>
          <small>${state.completed[item.id] ? '✓' : item.week}</small>
        </button>
      `).join('') : '<div class="side-note">没有找到匹配的知识点。</div>';
      routeList.querySelectorAll('[data-id]').forEach((button) => button.addEventListener('click', () => openModule(button.dataset.id)));
    }

    function renderInspector() {
      const item = selectedModule();
      const done = Boolean(state.completed[item.id]);
      inspector.style.setProperty('--module-color', item.color);
      inspector.innerHTML = `
        <div class="panel-title">
          <div>
            <div class="module-chip"><i></i>${item.week} · ${item.id}</div>
            <h2>${item.title}</h2>
            <p>${item.short}</p>
          </div>
          <button class="icon-btn close-panel" id="closePanel" aria-label="关闭详情">×</button>
        </div>
        <div class="detail-section"><h3>模块摘要</h3><p>${item.desc}</p></div>
        <div class="detail-section"><h3>学习状态</h3><p>${done ? '已完成此模块。' : '正文保持开放，进入详情页阅读完整手册。'}</p></div>
        <div class="panel-actions"><button class="primary-btn" id="openDetailButton">打开完整详情</button><button class="ghost-btn" id="focusButton">聚焦星球节点</button></div>
      `;
      document.getElementById('openDetailButton').addEventListener('click', () => openModule(item.id));
      document.getElementById('focusButton').addEventListener('click', () => focusNode(item.id));
      document.getElementById('closePanel').addEventListener('click', () => inspector.classList.remove('mobile-open'));
    }

    function openModule(id) {
      if (!modules.some((item) => item.id === id)) return;
      selectedId = id;
      state.selected = id;
      state.currentModule = id;
      saveState();
      window.location.href = 'FLUTTER_KNOWLEDGE_DETAIL.html?module=' + encodeURIComponent(id);
    }

    function selectModule(id) { openModule(id); }

    function renderDailyTask() {
      const item = selectedModule();
      const done = Boolean(state.tasks[item.id]);
      const card = document.getElementById('dailyTaskCard');
      card.innerHTML = `<b>今日任务</b><br /><span>${item.task}</span><br /><button class="ghost-btn" id="dailyTaskButton">${done ? '已完成任务 · 打开详情' : '打开今日任务'}</button>`;
      document.getElementById('dailyTaskButton').addEventListener('click', () => openModule(item.id));
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char]));
    }

    searchInput.addEventListener('input', (event) => {
      const query = event.target.value.trim().toLowerCase();
      filteredModules = modules.filter((item) => searchText(item).includes(query));
      renderRoute();
    });
    document.getElementById('menuButton').addEventListener('click', () => sidebar.classList.toggle('open'));
    document.getElementById('randomButton').addEventListener('click', () => {
      const item = modules[Math.floor(Math.random() * modules.length)];
      openModule(item.id);
    });
    document.getElementById('resetButton').addEventListener('click', () => {
      if (!confirm('确定要清除本地学习进度、练习和笔记吗？')) return;
      localStorage.removeItem(storageKey);
      Object.keys(state.completed).forEach((key) => delete state.completed[key]);
      Object.keys(state.tasks).forEach((key) => delete state.tasks[key]);
      Object.keys(state.notes).forEach((key) => delete state.notes[key]);
      state.read = {};
      state.results = {};
      state.wrong = [];
      state.xp = 0;
      state.badges = {};
      state.streak = { count: 0, lastDate: null };
      state.selected = null;
      state.currentModule = null;
      saveState();
      renderInspector();
      showToast('本地学习记录已清除');
    });

    // Three.js scene: a small, deliberately restrained knowledge planet.
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
    camera.position.set(0, 0.1, 7.3);
    const renderer = new THREE.WebGLRenderer({ canvas: sceneCanvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    const planet = new THREE.Group();
    scene.add(planet);
    const nodeMeshes = new Map();
    const nodeTargets = new Map();
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let pointerDown = false;
    let moved = false;
    let lastX = 0;
    let lastY = 0;
    let targetZoom = 7.3;
    let autoRotate = true;

    scene.add(new THREE.AmbientLight(0x8cbfff, 0.7));
    const keyLight = new THREE.PointLight(0x8cecff, 2.2, 16);
    keyLight.position.set(3.5, 3.2, 5);
    scene.add(keyLight);
    const rimLight = new THREE.PointLight(0x966dff, 1.6, 14);
    rimLight.position.set(-4, -1, -3);
    scene.add(rimLight);

    const planetCore = new THREE.Mesh(
      new THREE.SphereGeometry(1.42, 42, 42),
      new THREE.MeshPhongMaterial({ color: 0x133b65, emissive: 0x071c35, shininess: 35, transparent: true, opacity: 0.95 })
    );
    planet.add(planetCore);
    const wire = new THREE.Mesh(
      new THREE.SphereGeometry(1.46, 24, 16),
      new THREE.MeshBasicMaterial({ color: 0x4cbed8, wireframe: true, transparent: true, opacity: 0.15 })
    );
    planet.add(wire);

    const atmosphere = new THREE.Mesh(
      new THREE.SphereGeometry(1.7, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0x62e6ff, transparent: true, opacity: 0.055, side: THREE.BackSide })
    );
    planet.add(atmosphere);

    function addStars() {
      const positions = new Float32Array(750 * 3);
      for (let i = 0; i < positions.length; i += 3) {
        const radius = 10 + Math.random() * 8;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        positions[i] = radius * Math.sin(phi) * Math.cos(theta);
        positions[i + 1] = radius * Math.cos(phi);
        positions[i + 2] = radius * Math.sin(phi) * Math.sin(theta);
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      scene.add(new THREE.Points(geometry, new THREE.PointsMaterial({ color: 0xb8ddff, size: 0.018, transparent: true, opacity: 0.65 })));
    }
    addStars();

    function fibonacciPoint(index, total, radius) {
      const offset = 2 / total;
      const increment = Math.PI * (3 - Math.sqrt(5));
      const y = ((index * offset) - 1) + (offset / 2);
      const r = Math.sqrt(1 - y * y);
      const phi = index * increment;
      return new THREE.Vector3(Math.cos(phi) * r * radius, y * radius, Math.sin(phi) * r * radius);
    }

    function createNode(item, index) {
      const position = fibonacciPoint(index, modules.length, 1.64);
      const geometry = new THREE.SphereGeometry(0.105 + (index % 3) * 0.018, 16, 16);
      const material = new THREE.MeshStandardMaterial({ color: item.color, emissive: item.color, emissiveIntensity: 0.6, roughness: 0.34, metalness: 0.18 });
      const node = new THREE.Mesh(geometry, material);
      node.position.copy(position);
      node.userData = { id: item.id };
      planet.add(node);
      nodeMeshes.set(item.id, node);
      nodeTargets.set(item.id, position.clone());
      const ring = new THREE.Mesh(new THREE.RingGeometry(0.14, 0.16, 24), new THREE.MeshBasicMaterial({ color: item.color, transparent: true, opacity: 0.34, side: THREE.DoubleSide }));
      ring.position.copy(position);
      ring.lookAt(0, 0, 0);
      ring.userData = { id: item.id, ring: true };
      planet.add(ring);
    }
    modules.forEach(createNode);

    const orbitMaterials = [0x62e6ff, 0x8bf5bb, 0xb09cff];
    orbitMaterials.forEach((color, index) => {
      const orbit = new THREE.Mesh(new THREE.TorusGeometry(1.92 + index * 0.18, 0.006, 8, 96), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.22 }));
      orbit.rotation.x = 0.55 + index * 0.42;
      orbit.rotation.y = index * 0.7;
      planet.add(orbit);
    });

    function resizeScene() {
      const rect = sceneCanvas.getBoundingClientRect();
      const width = Math.max(rect.width, 1);
      const height = Math.max(rect.height, 1);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height, false);
    }
    window.addEventListener('resize', resizeScene);
    resizeScene();

    function updateNodeMaterials() {
      nodeMeshes.forEach((node, id) => {
        const item = modules.find((module) => module.id === id);
        const isSelected = id === selectedId;
        const complete = Boolean(state.completed[id]);
        node.material.emissiveIntensity = isSelected ? 1.65 : complete ? 1.05 : 0.52;
        node.scale.setScalar(isSelected ? 1.55 : complete ? 1.18 : 1);
      });
    }

    function focusNode(id) {
      selectedId = id;
      updateNodeMaterials();
      const target = nodeTargets.get(id);
      if (target) {
        planet.rotation.y = Math.atan2(target.x, target.z) * 0.65;
        planet.rotation.x = -Math.asin(target.y / target.length()) * 0.35;
      }
    }

    function updatePointer(event) {
      const rect = sceneCanvas.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    }
    sceneCanvas.addEventListener('pointerdown', (event) => { pointerDown = true; moved = false; lastX = event.clientX; lastY = event.clientY; sceneCanvas.setPointerCapture(event.pointerId); });
    sceneCanvas.addEventListener('pointermove', (event) => {
      if (!pointerDown) return;
      const dx = event.clientX - lastX;
      const dy = event.clientY - lastY;
      if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
      planet.rotation.y += dx * 0.006;
      planet.rotation.x = Math.max(-0.8, Math.min(0.8, planet.rotation.x + dy * 0.004));
      lastX = event.clientX;
      lastY = event.clientY;
      autoRotate = false;
    });
    sceneCanvas.addEventListener('pointerup', (event) => {
      pointerDown = false;
      if (!moved) {
        updatePointer(event);
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(Array.from(nodeMeshes.values()));
        if (hits.length) selectModule(hits[0].object.userData.id);
      }
    });
    sceneCanvas.addEventListener('wheel', (event) => { event.preventDefault(); targetZoom = Math.max(4.5, Math.min(10, targetZoom + event.deltaY * 0.004)); autoRotate = false; }, { passive: false });

    function animate() {
      requestAnimationFrame(animate);
      if (autoRotate) planet.rotation.y += 0.0013;
      camera.position.z += (targetZoom - camera.position.z) * 0.07;
      camera.lookAt(0, 0, 0);
      renderer.render(scene, camera);
    }
    animate();

    renderRoute();
    renderInspector();
    updateProgress();
    focusNode(selectedId);

    if (!window.THREE) {
      document.getElementById('sceneStatus').textContent = '需要网络加载 3D 引擎';
      showToast('Three.js 加载失败，请联网后刷新页面');
    }
  </script>
</body>
</html>
